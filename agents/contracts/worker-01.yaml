feature: WORKER-01
name: Job Lifecycle, validate_tree Gate, and DLQ on Final Failure
module: worker
phase: 1
source: rfcs/000-foundational-design.md#initial-contract-set

contracts:
  - id: WORKER-01-C1
    desc: "process_document_job runs the full ingestion pipeline and writes done status on success"
    trigger: "arq process_document_job picked up from the queue with a staging_key pointing to a valid file in MinIO"
    effect: "pageindex:job:<job_id> set to status=processing; staged file downloaded; client.index() called; on success pageindex:job:<job_id> set to status=done with doc_id; staging cleanup is CONDITIONAL -- a cleanup_staging flag (default False) is set True only on terminal outcomes (success, LowQualityTreeError, or job_try >= MAX_TRIES), and the finally block deletes the staged file from uploads/staging/ only when that flag is True; on a retryable failure the staged file is RETAINED so arq can re-download it on the next attempt"
    boundary: "Staged file exists in MinIO; client.index() and save_doc() both succeed"

  - id: WORKER-01-C2
    desc: "A failing validate_tree result is ROUTED, not uniformly rejected; only the reject routes surface error reason=low_quality_tree, and only a garbling reject writes a quarantine copy"
    trigger: "validate_tree() called inside client.index() returns a failing result (depth < 2 or node_count < 3 or garbling detected); finalize_gate_and_route then selects a Route, and the exhaustive (ok, route) dispatch at client/indexer.py:2680-2745 decides the outcome"
    effect: "Four outcomes, not one. (a) Route.FLAT, clean -- the DEFAULT for NODE_COUNT_LOW/DEPTH_LOW defects under flat_doc_routing: persists a FLAT document, returns a doc_id, job reaches status=done; pageindex_low_quality_trees_total is NOT incremented and nothing is quarantined. (b) Route.FLAT, garble rejection -- when per-block garbling survives recovery, _persist_flat_result sets flat_garble_unrecovered, DOES write quarantine/<sha256>.json (:1881) and returns None; the dispatch then re-emits it as a reject with reason=garbling. (c) Route.REJECT -- save_doc is NOT called, LOW_QUALITY_TREES is incremented and LowQualityTreeError is raised, so pageindex:job:<job_id> is set to status=error with reason=low_quality_tree; the unserved quarantine copy (OCR-01-C4), which no MCP tool or HTTP route reads, is written ONLY when first_defect is GARBLING or NODE_GARBLING (:2716-2731). A NODE_COUNT_LOW/DEPTH_LOW reject, and a Route.FLAT persist that returns None because flat_md is None (:1754), write NO quarantine. (d) Route.TREE / Route.PERSIST_FAIL -- the tree IS persisted, carrying the verdict compute_verdict returns for it, which is NOT always FAIL: TreeDefect.BIDI_DEGRADED yields MARGINAL (helpers/verdict.py:114). The :2740 log line says 'with FAIL verdict' unconditionally and is a misnomer on that path. worker/job.py:272-278 attaches sha256 to every reason=low_quality_tree body, so that field is a usable quarantine key only for the garbling rejections in (b) and (c)"
    boundary: "Phase 1 warn-only mode -- the counter increments and status=error is set, but the depth/node_count thresholds are not enforced as a hard CI gate (pending calibration against the GHV corpus) and, under flat_doc_routing, do not reject at all"

  - id: WORKER-01-C3
    desc: "On final failure after max_tries the job is pushed to the DLQ"
    trigger: "process_document_job raises an unhandled exception on its final retry attempt (max_tries=2, job_timeout=900s)"
    effect: "pageindex:job:<job_id> set to status=error with a reason field; staging_key and error details pushed to Redis list pageindex:dlq; the DLQ entry is observable for manual triage"
    boundary: "Job has exhausted all retry attempts (max_tries=2); exception is not low_quality_tree (which is caught and handled in WORKER-01-C2)"
