feature: ERASE-01
name: Right-to-Erasure Cascade Across Every Derived Store
module: storage
phase: 2
source: rfcs/001-initial-plan-review.md#amendment-1

# Hard Rule 2: deleting the raw upload does NOT auto-remove derivatives. A DSR
# delete must purge, explicitly and in this order (the _ERASURE_MANIFEST in
# storage/documents.py): MinIO uploads/, processed/<id>.json,
# processed/<id>.flat.json, figures/, verdicts/, processed/<id>.meta.json,
# quarantine/<sha256>.{json,meta.json}, the Redis cache (and the reconcile-etag
# entry), the hash cache, the Postgres registry row, preloaded/, and any
# documented backup.
contracts:
  - id: ERASE-01-C1
    desc: "A DSR delete for a doc_id cascades across all derived stores in the mandated order"
    trigger: "delete_doc(doc_id) called for a doc_id that has been fully indexed"
    effect: "MinIO objects are removed in order uploads/<doc_id>/ then processed/<doc_id>.json then processed/<doc_id>.meta.json; then the Redis cache key pageindex:doc:<doc_id> is deleted; the order is observable (logged or asserted) and the filename->sha256 hash-cache entry for the doc is cleared so a re-upload re-indexes"
    boundary: "doc_id exists in MinIO processed/ at call time"

  - id: ERASE-01-C2
    desc: "Erasure is idempotent — deleting an already-deleted or never-existing doc_id is a no-op success"
    trigger: "delete_doc(doc_id) called when some or all of the doc_id derivatives are already absent"
    effect: "Each store delete tolerates a missing object (no S3Error/KeyError surfaced); the call returns success without re-creating any object; a second delete_doc(doc_id) produces the same end state as the first"
    boundary: "null"

  - id: ERASE-01-C3
    desc: "A partial-failure mid-cascade does not leave an orphaned derivative silently"
    trigger: "delete_doc(doc_id) where one store delete (e.g. the Redis cache key) raises after an earlier store delete succeeded"
    effect: "The failure is surfaced (raised or returned with a reason), names which store was not purged, and the operation is safe to retry to completion; no derivative is reported as erased while still present"
    boundary: "An infra error occurs on one of the cascade steps"

  - id: ERASE-01-C4
    desc: "The erasure cascade includes quarantine/<sha256>.json and quarantine/<sha256>.meta.json"
    trigger: "delete_doc(doc_id) runs the _ERASURE_MANIFEST and the quarantine step's sha256 is available"
    effect: "quarantine/<sha256>.json and quarantine/<sha256>.meta.json are removed by _erase_quarantine; the step is required=False (quarantine may not exist for every doc); idempotent on NoSuchKey"
    boundary: "sha256 must be discovered before the quarantine step runs (meta_json sidecar read provides it)"

  - id: ERASE-01-C5
    desc: "The erasure cascade files Loki delete requests for every log line that names the document"
    trigger: "delete_doc(doc_id) runs the _ERASURE_MANIFEST with PAGEINDEX_LOKI_URL set to the in-cluster Loki"
    effect: "_erase_loki_logs POSTs one /loki/api/v1/delete request per known identifier (doc_id always; the doc_sha8 and doc_name_sha8 JSON pairs when ctx.sha256 / ctx.doc_name are known) over [now - PAGEINDEX_LOKI_ERASURE_LOOKBACK_H, now], each needle quoted so it cannot widen the selector; a refused or failed request lands in errors as 'loki: ...' without quoting the identifier; with the URL unset the step is not reached and partial_purge is True"
    boundary: "Runs last (step 8) so ctx.sha256 and ctx.doc_name are resolved and the cascade's own ERASE lines fall inside the window; Loki's retention_period (72h) is the backstop for anything a request misses"
