feature: INDEX-01
name: PDF Input Routes Through Markdown-First Extraction
module: client
phase: 1
source: rfcs/000-foundational-design.md#initial-contract-set

contracts:
  - id: INDEX-01-C1
    desc: "A .pdf input is routed through pdf_to_markdown then _run_md_to_tree, not through PyPDF2"
    trigger: "client.index() called with a .pdf file path"
    effect: "pdf_to_markdown (pymupdf4llm + _relevel_headings) is invoked first producing a temporary .md file; _run_md_to_tree is called on that .md; _run_page_index (PyPDF2) is NOT called in the primary path; the no_pypdf2_in_new_pdf_path static gate remains green"
    boundary: "pdf_to_markdown succeeds without raising an exception"

  - id: INDEX-01-C2
    desc: "A .pdf input falls back to the legacy _run_page_index whenever the pdf_markdown_converters() chain yields no markdown -- by exhaustion OR by a ConverterFailurePolicy that terminates the walk early"
    trigger: "client.index() called with a .pdf and the pdf_markdown_converters() chain (built client/indexer.py:832) produces no md_content. Four distinct paths reach that state: (a) every entry failed and the walk ran off the end of the chain; (b) ConverterFailurePolicy.BLOCK_AGPL -- a transient failure whose next entry is AGPL, walk blocked under HR4 (:1040); (c) ConverterFailurePolicy.REJECT -- no entries remain after the failing one (:1053); (d) ConverterFailurePolicy.GATE_AGPL_STRUCTURAL with agpl_structural_fallback_enabled=false (:1062). In (b), (c) and (d) a SINGLE converter failing IS sufficient -- the chain is broken by policy, not exhausted"
    effect: "The chain's else-arm (:1193-1207) increments PDF_EXTRACT_FALLBACKS, emits pdf_conversion_outcome with choice all_converters_failed_legacy_fallback, and calls _run_page_index_retrying(file_path) (consistent with CONV-01-C1). That choice label predates the policy branches and is a misnomer on paths (b)-(d); AGPL_FALLBACK_TOTAL{reason=transient_blocked} and {reason=structural_blocked} are the signals that distinguish a policy-terminated walk from a genuinely exhausted chain"
    boundary: "The converter chain produced no markdown -- whether by full-chain failure or by policy termination"

  - id: INDEX-01-C3
    desc: "Non-.pdf inputs (.docx, .html) follow their existing converter routes unchanged"
    trigger: "client.index() called with a .docx or .html file path"
    effect: "For .docx the primary route is libreoffice_to_pdf then _run_page_index, with docx_to_markdown then _run_md_to_tree as the LibreOffice/page_index failure fallback; for .html, html_to_markdown_with_images is invoked; pdf_to_markdown is NOT called; the resulting tree is passed to validate_tree before save_doc"
    boundary: "File extension is not .pdf"
