[project]
name = "paddleocr-service"
version = "0.1.0"
description = "PaddleOCR 3.x OCR service for RFC-046 POC evaluation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pillow>=11.0.0",
    "numpy>=2.0.0",
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.7.0",
    "PyMuPDF>=1.24.0",
]
