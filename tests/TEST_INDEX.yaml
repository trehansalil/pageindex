# tests/TEST_INDEX.yaml — Source-to-test mapping index
#
# Every src/pageindex_mcp/*.py file MUST have an entry here.
# The gate script (scripts/gates/test-index-guard.sh) enforces:
#   1. Every source file in src/pageindex_mcp/ has a mapping entry
#   2. Every test file listed here actually exists
#   3. On commit: warns if a source file changed but none of its mapped tests did
#
# coverage_threshold: per-file override (falls back to governance default of 70%)
# primary: true marks the "main" test file; others are cross-cutting/integration

mappings:

  # ── Core indexing / RAG path (coverage: 90%) ────────────────────────────────
  client/indexer.py:
    coverage_threshold: 90
    tests:
      - test_client.py            # primary
      - test_source_invariants.py
      - test_verdict.py
      - test_ocr_fallback.py
      - test_config.py
      - test_converters.py
      - test_gates.py
      - test_image_blocks.py
      - test_inspector.py
      - test_bidi.py
      - test_flat.py
      - test_garble.py
      - test_quarantine.py
      - test_density_gate.py
      - test_obs_logging.py
      - test_hr3_zdr_egress.py
      - test_recovery.py
      - test_worker.py

  client/images.py:
    coverage_threshold: 90
    tests:
      - test_client.py
      - test_garble.py
      - test_image_blocks.py
      - test_inspector.py
      - test_bidi.py
      - test_flat.py
      - test_verdict.py
      - test_gates.py

  client/recovery.py:
    coverage_threshold: 90
    tests:
      - test_client.py
      - test_config.py
      - test_converters.py
      - test_gates.py
      - test_image_blocks.py
      - test_obs_logging.py
      - test_inspector.py
      - test_bidi.py
      - test_verdict.py
      - test_recovery.py
      - test_garble.py
      - test_integration.py          # RFC-043 D1: e2e zero-content recovery

  client/remote.py:
    coverage_threshold: 90
    tests:
      - test_hr3_zdr_egress.py     # primary
      - test_bidi.py
      - test_config.py
      - test_converters.py
      - test_selective_tableformer.py

  client/llm.py:
    coverage_threshold: 90
    tests:
      - test_client.py
      - test_converters.py
      - test_hr3_zdr_egress.py
      - test_worker.py
      - test_obs_logging.py

  # ── Data-integrity critical (coverage: 90%) ─────────────────────────────────
  storage/minio_ops.py:
    coverage_threshold: 90
    tests:
      - test_storage.py           # primary
      - test_density_gate.py
      - test_obs_logging.py
      - test_converters.py
      - test_hr3_zdr_egress.py
      - test_bidi.py
      - test_staging_e2e.py

  storage/ingest_lock.py:
    coverage_threshold: 90
    tests:
      - test_helpers_combined.py  # primary (RFC-050 D7)
  storage/documents.py:
    coverage_threshold: 90
    tests:
      - test_storage.py           # primary
      - test_client.py
      - test_density_gate.py
      - test_image_blocks.py
      - test_obs_logging.py
      - test_inspector.py
      - test_bidi.py
      - test_converters.py
      - test_verdict.py
      - test_gates.py
      - test_registry.py
      - test_quarantine.py
      - test_integration.py          # RFC-043 D1/D5: e2e recovery + erasure

  storage/verdict.py:
    coverage_threshold: 90
    tests:
      - test_storage.py               # primary
      - test_registry.py
      - test_client.py
      - test_density_gate.py
      - test_image_blocks.py
      - test_obs_logging.py
      - test_inspector.py
