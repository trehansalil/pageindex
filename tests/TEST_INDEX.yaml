# tests/TEST_INDEX.yaml — Source-to-test mapping index
#
# Every src/pageindex_mcp/*.py file MUST have an entry here.
# The gate script (scripts/gates/test-index-guard.sh) enforces:
#   1. Every source file in src/pageindex_mcp/ has a mapping entry
#   2. Every test file listed here actually exists
#   3. On commit: warns if a source file changed but none of its mapped tests did
#
# coverage_threshold: per-file override (falls back to governance default of 70%)
# primary: true marks the "main" test file; others are cross-cutting/integration

