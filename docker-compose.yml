# docker-compose.yml — local testing stack for the PageIndex MCP server.
#
# The deployed app (see hetzner-deployment-service/apps/pageindex-mcp) depends on
# three things: Redis (arq job queue + document cache), MinIO (object storage),
# and an OpenAI-compatible API. This file stands up Redis + MinIO locally so you
# can exercise the server and worker without the production cluster.
#
# ─── Two ways to use it ──────────────────────────────────────────────────────
#
#   1. Infra only (Redis + MinIO + Postgres) — app runs on your host:
#        make env PROFILE=local
#        make compose-infra
#        make up                        # server + worker, or `make serve` / `make worker`
#
#   2. Full deployment (all in containers):
#        make env PROFILE=local APP=compose
#        make compose-app
#        # server  -> http://localhost:8201/mcp   (and /upload, /metrics)
#        # MinIO   -> http://localhost:9001        (console: minioadmin/minioadmin)
#
#   3. Containers, but pointed at the shared remote cluster:
#        make env PROFILE=remote APP=compose MINIO_ACCESS=public
#        make compose-app
#
# The Docling service lives behind its own `docling-local` profile — the default
# is the remote Scaleway one. Start it with `make compose-docling` after
# `make env DOCLING=local`.
#
# Secrets (OPENAI_API_KEY, UPLOAD_API_KEY, MCP_BEARER_TOKEN, …) come from .env.
# Addresses come from .env.active, the resolved output of `make env`, which the
# make targets pass with --env-file. See docs/ENV_PROFILES.md.
#
# Requires Docker Compose v2.24+ (for `env_file: required: false` and
# `service_completed_successfully`).

name: pageindex-local

# Shared config for the server + worker containers (same image, different command).
x-app: &app
  image: pageindex-mcp:local
  build: .
  # Pulls OPENAI_API_KEY / CHATGPT_API_KEY / UPLOAD_API_KEY / MCP_BEARER_TOKEN etc.
  # Both optional so `docker compose up` (infra only) works without either.
  # .env.active is listed second so it wins: it is the resolved output of
  # `make env`, and it is what carries the local/remote toggles.
  env_file:
    - path: .env
      required: false
    - path: .env.active
      required: false
  # Defaults below are the compose-network addresses. They are only defaults —
  # `make env PROFILE=remote APP=compose` puts real values in .env.active and
  # passes it via --env-file, so containers can talk to the shared cluster
  # instead. Hardcoding them here would make the toggles a lie.
  environment:
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    MINIO_BUCKET: ${MINIO_BUCKET:-pageindex}
    MINIO_SECURE: ${MINIO_SECURE:-false}
    # Set when MINIO_ENDPOINT is a reverse-proxied public route rather than
    # MinIO itself; applied in the HTTP client after signing.
    MINIO_PATH_PREFIX: ${MINIO_PATH_PREFIX:-}
    MINIO_PRESIGN_ENDPOINT: ${MINIO_PRESIGN_ENDPOINT:-}
    MINIO_PRESIGN_SECURE: ${MINIO_PRESIGN_SECURE:-true}
    # Route prefix spliced into presigned URLs after signing (the public MinIO
    # route strips it again before MinIO verifies the signature).
    MINIO_PRESIGN_PATH_PREFIX: ${MINIO_PRESIGN_PATH_PREFIX:-}
    MCP_HOST: "0.0.0.0"
    MCP_PORT: "8201"
    WEB_CONCURRENCY: "1"
    CACHE_TTL: "300"
    # RFC-006: Postgres registry DSN. Targets the compose postgres service.
    # Set REGISTRY_ENABLED=false in .env to disable if Postgres is not needed.
    POSTGRES_DSN: ${POSTGRES_DSN:-postgresql://pageindex:pageindex@postgres:5432/pageindex}
    REGISTRY_ENABLED: ${REGISTRY_ENABLED:-true}
    PAGEINDEX_CATALOG_TOPK: ${PAGEINDEX_CATALOG_TOPK:-200}
    # Defaults to the Scaleway service in .env.active (PI_DOCLING=remote, the
    # default). `make env DOCLING=local` + `make compose-docling` swaps in the
    # container below.
    DOCLING_SERVICE_URL: ${DOCLING_SERVICE_URL:-http://docling-service:8080}
    DOCLING_SERVICE_BEARER_TOKEN: ${DOCLING_SERVICE_BEARER_TOKEN:-}
  depends_on:
    redis:
      condition: service_healthy
    minio-setup:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
  restart: unless-stopped

services:
  # ─── Redis: arq job queue + Redis-backed document cache ──────────────────────
  redis:
    image: redis:7-alpine
    container_name: pageindex-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── MinIO: S3-compatible object storage for processed trees + uploads ───────
  minio:
    image: minio/minio:latest
    container_name: pageindex-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"   # S3 API   (app default endpoint: localhost:9000)
      - "9001:9001"   # Web console -> http://localhost:9001
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ─── One-shot: wait for MinIO, then create the bucket the app expects ────────
  # The app auto-creates the bucket on first use too, but pre-creating it gives a
  # clean readiness gate (`service_completed_successfully`) for the app services.
  minio-setup:
    image: minio/mc:latest
    container_name: pageindex-minio-setup
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-pageindex};
      echo 'minio bucket ready: ${MINIO_BUCKET:-pageindex}';
      "
    restart: "no"

  # ─── Postgres: document registry (RFC-006) ───────────────────────────────────
  # Used by the app for corpus-scale doc discovery and BM25 narrowing.
  # Set REGISTRY_ENABLED=false to disable registry reads/writes without removing
  # this service. Port 5432 is exposed for the host-side backfill script and psql.
  postgres:
    image: postgres:16-alpine
    container_name: pageindex-postgres
    environment:
      POSTGRES_USER: pageindex
      POSTGRES_PASSWORD: pageindex
      POSTGRES_DB: pageindex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pageindex -d pageindex"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ─── PageIndex MCP server (gunicorn + uvicorn workers) ───────────────────────
  # Only starts with `--profile app`; otherwise this is infra-only.
  pageindex-mcp:
    <<: *app
    container_name: pageindex-mcp
    profiles: ["app"]
    ports:
      - "8201:8201"
    # CMD defaults to gunicorn (see Dockerfile).
    healthcheck:
      # /metrics is public (no bearer auth) — a cheap liveness probe.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8201/metrics')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─── arq worker: background document processing ──────────────────────────────
  pageindex-mcp-worker:
    <<: *app
    container_name: pageindex-mcp-worker
    profiles: ["app"]
    command: ["arq", "pageindex_mcp.worker.WorkerSettings"]
    # No `environment:` override here — it would replace the *whole* x-app map
    # and re-hardcode the addresses the toggles are meant to control.
    #
    # depends_on deliberately omits docling-service: with PI_DOCLING=remote
    # (the default) that container is not started at all, and Compose errors on
    # a dependency whose profile is inactive. The worker retries the conversion
    # call, so a not-yet-ready local Docling is not fatal either.

  # ─── External Docling conversion service ────────────────────────────────────
  # Heavy PDF conversion (~1.9 GB RSS) runs here instead of the worker.
  #
  # Behind its own `docling-local` profile because the default is the remote
  # Scaleway service (PI_DOCLING=remote) — no reason to build a 1.9 GB image
  # you are not going to call. Start it with `make compose-docling`, and point
  # the app at it with `make env DOCLING=local`.
  docling-service:
    build:
      context: .
      dockerfile: services/docling-service/Dockerfile
    container_name: pageindex-docling-service
    profiles: ["docling-local"]
    environment:
      DOCLING_ARTIFACTS_PATH: /opt/docling-models
      TESSDATA_PREFIX: /opt/tessdata
      DOCLING_DO_OCR: "1"
      DOCLING_SERVICE_BEARER_TOKEN: ${DOCLING_SERVICE_BEARER_TOKEN:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─── RFC-036 D7 OCR spike services (evaluation only, NOT production) ───────
  # Behind their own `ocr-spike` profile: heavy images (PaddlePaddle / EasyOCR
  # model weights) that only scripts/ocr_spike_eval.py talks to. Start with
  # `docker compose --profile ocr-spike up`.
  paddleocr-service:
    build:
      context: services/paddleocr-service
      dockerfile: Dockerfile
    container_name: pageindex-paddleocr-service
    profiles: ["ocr-spike"]
    environment:
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-ar}
      PADDLEOCR_USE_GPU: ${PADDLEOCR_USE_GPU:-false}
    ports:
      - "8202:8202"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8202/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  docling-ocr-service:
    build:
      context: services/docling-ocr-service
      dockerfile: Dockerfile
    container_name: pageindex-docling-ocr-service
    profiles: ["ocr-spike"]
    environment:
      DOCLING_OCR_LANG: ${DOCLING_OCR_LANG:-ar,en}
    ports:
      - "8203:8203"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8203/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  redis_data:
  minio_data:
  postgres_data:
