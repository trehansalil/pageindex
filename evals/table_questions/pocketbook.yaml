# RFC-052 R8 AC5 (task 9.5) table question set for
# `scripts/table_search_eval.py`, run against the World Statistics Pocketbook
# 2023 (`issue/data2/world-stats-pocketbook-2023.pdf`, public UN statistics --
# no PII). Every answer below was read directly off the PDF with PyMuPDF
# (`fitz`) text extraction, NOT invented -- see BUILDER E's report for the
# extraction commands.
#
# Schema per entry:
#   id           short stable slug
#   question     natural-language question a searcher might ask
#   answer       the expected figure/name, exactly as printed in the table
#   answer_page  0-based PDF page index (matches the `tables.json` / capture
#                convention: "page is 0-based") of the profile page carrying
#                the answer
#   table_hint   which table/section on that page holds the answer, for a
#                human skimming a failure
#
# `scripts/table_search_eval.py` normalizes both the stored `answer` and the
# returned search text (casefold, collapse whitespace, drop thousands-
# separator spaces) before checking containment, so "96 698 005" and
# "96698005" are treated as the same hit.

questions:
  - id: world-gdp-2023
    question: "What was the World's GDP (gross domestic product, million current US$) in 2023?"
    answer: "96 698 005"
    answer_page: 12
    table_hint: "World profile, Economic indicators table, 2023 column"

  - id: africa-population-2023
    question: "What was Africa's population (in thousands) in 2023?"
    answer: "1 426 736"
