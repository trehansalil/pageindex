# audit/zones/ZONE_OWNERSHIP.yaml
#
# Zone-to-RFC-deliverable ownership manifest. Bootstrapped from
# audit/zones/_index.md (POST-FIX-WAVE4, 2026-08-29). Consumed by
# scripts/rfc_lifecycle_lint.py (RFC-041 D8) to catch the RFC-040 Zone 2
# pattern: a zone's owning RFC closes while the zone's bugs remain
# unresolved and no successor RFC has picked it up.
#
# Schema (per zone):
#   name:            zone title, from _index.md
#   severity:        critical | high | medium
#   bug_count:       int, from _index.md
#   owning_rfc:      RFC id currently accountable for the zone (or null if
#                    never assigned to an RFC deliverable)
#   owning_deliverable: D-number(s) within owning_rfc, or null
#   resolved:        whether the zone's bugs are considered fixed
#   successor_rfc:   set when ownership transfers from a closed owning_rfc
#                    to a new RFC before the old one closes; the lint script
#                    treats a zone as clean (not orphaned) once this is set,
#                    even if owning_rfc's status is closed
#   successor_deliverable: D-number(s) within successor_rfc, or null
#   notes:           free text

version: 1
source_index: audit/zones/_index.md
audit_run: POST-FIX-WAVE4
last_updated: "2026-09-01"
validation_date: "2026-09-01"
validation_notes: |
  Code validation refuted 2/3 Zone 1 claims (AGPL fixed, ordering wrong).
  Zone 4 (Content Measurement) resolved by RFC-041 D2.
  Zone 5 MinIO CAS guard removed entirely (worse than divergence).
  Zone 6 os.environ spread is 17 files (not 9).
  RFC split: RFC-042 (Verdict+Config), RFC-043 (OCR+Garble+Erasure).

